name: MD desktop apps (MD-442, MD-187, MD-888 for Mac and Windows)
on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:     # run by hand to pick up the latest web app from the site
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        style: ['442', '187', '888']
        target:
          - { os: macos-latest, cmd: 'dist:mac', ext: 'mac.dmg' }
          - { os: windows-latest, cmd: 'dist:win', ext: 'windows.exe' }
    runs-on: ${{ matrix.target.os }}
    defaults: { run: { working-directory: desktop, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Bundle the live web app
        run: |
          node fetch-web.js
          cp web/app/icon-512.png build/icon.png
          node variant.js ${{ matrix.style }}
      - run: npm run ${{ matrix.target.cmd }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: 'md${{ matrix.style }}-${{ matrix.target.ext }}', path: 'desktop/dist/md${{ matrix.style }}-${{ matrix.target.ext }}', if-no-files-found: error }
  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish to the "desktop" release (stable download URLs)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          ls -la out
          gh release view desktop >/dev/null 2>&1 || gh release create desktop --title "MD|442 desktop apps" --notes-file desktop/INSTALL.md --latest=false
          gh release upload desktop out/md*-mac.dmg out/md*-windows.exe --clobber
          gh release edit desktop --notes-file desktop/INSTALL.md --title "MD desktop apps: MD-442, MD-187, MD-888 (build ${GITHUB_RUN_NUMBER})"
